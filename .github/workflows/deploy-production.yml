name: Deploy production

# Deploys main to Vercel production on every push.
#
# This workflow is INERT until three repository secrets exist:
#   VERCEL_TOKEN       - create at vercel.com -> Account Settings -> Tokens
#   VERCEL_ORG_ID      - team_uBQB8dqirkYrzoBxS0YQ9MMs   (from .vercel/repo.json)
#   VERCEL_PROJECT_ID  - prj_sWrVRl8CGCF3fIT5njGyoh2rJCqU (from .vercel/repo.json)
#
# Set them with:
#   gh secret set VERCEL_TOKEN --body "<token>"
#   gh secret set VERCEL_ORG_ID --body "team_uBQB8dqirkYrzoBxS0YQ9MMs"
#   gh secret set VERCEL_PROJECT_ID --body "prj_sWrVRl8CGCF3fIT5njGyoh2rJCqU"
#
# The deploy step is guarded on VERCEL_TOKEN, so until the secret is added this
# workflow runs and succeeds as a no-op (no failing runs, no accidental deploys).
#
# Background: pushes to main were not triggering Vercel's native GitHub
# integration, so production had to be shipped manually with `vercel --prod`
# (see RUNBOOK.md). This workflow restores push-to-deploy without relying on the
# native integration. If the native integration is later repaired, disable one of
# the two to avoid double deploys.

on:
  push:
    branches: [main]

# Avoid overlapping production deploys; cancel superseded runs.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Report skip when unconfigured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN secret not set — skipping deploy. See this file's header to enable."

      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
